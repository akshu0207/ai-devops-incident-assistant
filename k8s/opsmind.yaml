
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opsmind-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsmind
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opsmind
  template:
    metadata:
      labels:
        app: opsmind
    spec:
      containers:
        - name: opsmind
          image: opsmind-ai:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: opsmind-secrets
                  key: GEMINI_API_KEY

            - name: DATABASE_URL
              value: "sqlite:////app/data/incidents.db"

          volumeMounts:
            - name: database-storage
              mountPath: /app/data

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

      volumes:
        - name: database-storage
          persistentVolumeClaim:
            claimName: opsmind-data

---
apiVersion: v1
kind: Service
metadata:
  name: opsmind-service
spec:
  type: ClusterIP
  selector:
    app: opsmind
  ports:
    - port: 8000
      targetPort: 8000
